server:
  port: 8080

spring:
  application:
    name: water-reminder

  datasource:
    mysql:
      # 桌面版自包含：用户数据存本地 H2 文件（无需 MySQL）
      url: jdbc:h2:file:./data/water_reminder_user;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
    h2:
      url: jdbc:h2:file:./data/water_reminder_h2;MODE=MySQL;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password:

  h2:
    console:
      enabled: false

  web:
    resources:
      static-locations: classpath:/static/

jwt:
  # 本地开发时通过环境变量注入：JWT_SECRET=<base64 编码，至少 32 字节>
  secret: "${JWT_SECRET:Y2hhbmdlLW1lLWp3dC1zZWNyZXQtcGxhY2Vob2xkZXItZm9yLWxvY2FsLWRldi1vbmx5LTEyMzQ1Njc4OTA=}"
  expiration-ms: 86400000

logging:
  level:
    com.waterreminder: INFO
